name: Update storm data
on:
  schedule:
    - cron: "40 8,20 * * *"   # IFS 00z/12z open data is published ~7-8 h after the run
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "pipeline[dev]"
      - run: cd pipeline && pytest -q
      - name: Fetch + process latest ECMWF open data
        working-directory: pipeline
        # ECMWF's own server first; the AWS mirror is the fallback (it can be very slow, with 503 errors).
        # Each attempt is capped so a slow mirror can't hold the job for hours.
        run: |
          timeout 15m python -m stormatlas fetch --source ecmwf --stride 2 --out ../web/data --names ../names.json \
            || timeout 20m python -m stormatlas fetch --source aws --stride 2 --out ../web/data --names ../names.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4
